<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주문내역 · OLIVE YOUNG</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="section-title"><h2>주문 내역</h2></div>
    <div id="orders-body"></div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    function fmtDate(s) {
      const d = new Date(s);
      if (isNaN(d)) return s;
      return d.toLocaleDateString('ko-KR') + ' ' + d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    }

    async function load() {
      const me = await getMe();
      if (!me) { location.href = '/login.html'; return; }

      const orders = await api('/api/orders');
      const body = document.getElementById('orders-body');

      if (orders.length === 0) {
        body.innerHTML = `<p class="empty">주문 내역이 없습니다.<br/><a href="/" class="link-strong">쇼핑하러 가기</a></p>`;
        return;
      }

      body.innerHTML = orders.map((o) => {
        const cancelled = o.status === '주문취소';
        const items = o.items.map((it) => `
          <div class="list-row" style="grid-template-columns:70px 1fr 100px 120px">
            <img src="${it.thumbnail_url}" onerror="this.style.visibility='hidden'" />
            <div>
              <div class="brand">${it.brand_name}</div>
              <div><a href="/product.html?id=${it.product_id}">${it.name}</a></div>
            </div>
            <div style="color:var(--gray)">${it.quantity}개</div>
            <div style="font-weight:700">${won(it.price_at_purchase * it.quantity)}</div>
          </div>`).join('');

        return `
          <div class="order-card">
            <div class="head">
              <span>주문번호 #${o.id} · ${fmtDate(o.created_at)}</span>
              <span class="badge ${cancelled ? 'cancel' : 'done'}">${o.status}</span>
            </div>
            ${items}
            <div style="text-align:right;margin-top:12px;font-weight:800">
              총 결제금액 <span style="color:var(--lime-dark)">${won(o.total_amount)}</span>
            </div>
          </div>`;
      }).join('');
    }

    load();
  </script>
</body>
</html>
