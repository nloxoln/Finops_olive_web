name: Deploy to EC2 via CodeDeploy

# main 브랜치에 push 되면 자동 배포
on:
  push:
    branches: [main]

# GitHub Actions 에 아래 Secrets 를 등록해두세요:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  (배포 권한 IAM 사용자)
#   AWS_REGION            예) ap-northeast-2
#   S3_BUCKET             배포 번들을 올릴 S3 버킷 이름
#   CODEDEPLOY_APP        CodeDeploy 애플리케이션 이름
#   CODEDEPLOY_GROUP      CodeDeploy 배포 그룹 이름

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 배포 번들을 S3 로 업로드
        run: |
          aws deploy push \
            --application-name ${{ secrets.CODEDEPLOY_APP }} \
            --s3-location s3://${{ secrets.S3_BUCKET }}/oliveyoung-${{ github.sha }}.zip \
            --source .

      - name: CodeDeploy 배포 생성
        run: |
          aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APP }} \
            --deployment-group-name ${{ secrets.CODEDEPLOY_GROUP }} \
            --s3-location bucket=${{ secrets.S3_BUCKET }},key=oliveyoung-${{ github.sha }}.zip,bundleType=zip
