name: Deploy to EC2 via CodeDeploy

# main 브랜치에 push 되면 자동 배포
on:
  push:
    branches: [main]

# GitHub Actions 에 아래 Secrets 2개만 등록하면 됩니다:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  (배포 권한 IAM 사용자)
# 아래 이름들은 Terraform 에서 고정한 값이라 그대로 사용합니다.
env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: oliveyoung-codedeploy-bundles
  CODEDEPLOY_APP: oliveyoung-app
  CODEDEPLOY_GROUP: oliveyoung-dg
  STATIC_BUCKET: front-caching # css/js 정적파일 버킷 (Terraform s3_static_bucket_name)
  CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }} # terraform output cloudfront_distribution_id

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 배포 번들을 S3 로 업로드
        run: |
          aws deploy push \
            --application-name $CODEDEPLOY_APP \
            --s3-location s3://$S3_BUCKET/oliveyoung-${{ github.sha }}.zip \
            --source .

      - name: CodeDeploy 배포 생성
        run: |
          aws deploy create-deployment \
            --application-name $CODEDEPLOY_APP \
            --deployment-group-name $CODEDEPLOY_GROUP \
            --s3-location bucket=$S3_BUCKET,key=oliveyoung-${{ github.sha }}.zip,bundleType=zip

      # css/js 를 S3(정적 캐싱 버킷)로 업로드
      - name: 정적 파일(css/js) S3 동기화
        run: |
          aws s3 sync public/css s3://$STATIC_BUCKET/css --delete
          aws s3 sync public/js  s3://$STATIC_BUCKET/js  --delete

      # 변경된 css/js 가 즉시 반영되도록 CloudFront 캐시 무효화
      - name: CloudFront 캐시 무효화
        if: env.CLOUDFRONT_DIST_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DIST_ID \
            --paths "/css/*" "/js/*"
